server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: route all non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend
    # Works in both Docker Compose (backend) and K8s (myvault-backend)
    # by using a variable so nginx resolves at runtime, not startup
    location /api/ {
        resolver 127.0.0.11 10.32.0.10 valid=10s ipv6=off;
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        resolver 127.0.0.11 10.32.0.10 valid=10s ipv6=off;
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://unpkg.com; script-src 'self' https://unpkg.com; img-src 'self' data: https:; connect-src 'self' http://localhost:8082 https://*.fake-domain.name https://*.example.com;" always;
}
