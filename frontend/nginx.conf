server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: route all non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend
    # Works in both Docker Compose (backend) and K8s (myvault-backend)
    # by using a variable so nginx resolves at runtime, not startup
    location /api/ {
        resolver 127.0.0.11 10.32.0.10 valid=10s ipv6=off;
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        resolver 127.0.0.11 10.32.0.10 valid=10s ipv6=off;
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # __OIDC_ORIGIN__ est remplace au build par l'origine du fournisseur d'identite,
    # deduite de VITE_OIDC_AUTHORITY (cf. Dockerfile). Sans cela, connect-src interdit
    # au navigateur de joindre le SSO : la connexion echoue avec un « Failed to fetch »
    # qui ne mentionne jamais la politique de securite de contenu.
    # font-src est explicite : sans lui, les polices retombent sur default-src 'self'
    # et la typographie officielle ne se charge pas.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://unpkg.com; script-src 'self' https://unpkg.com; font-src 'self' data: https://unpkg.com; img-src 'self' data: https:; connect-src 'self' http://localhost:8082 __OIDC_ORIGIN__;" always;
}
