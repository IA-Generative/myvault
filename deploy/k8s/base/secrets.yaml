apiVersion: v1
kind: Secret
metadata:
  name: myvault-credentials
  namespace: myvault
type: Opaque
stringData:
  POSTGRES_USER: myvault
  POSTGRES_PASSWORD: CHANGE_ME
  MYVAULT_MASTER_KEY: CHANGE_ME_GENERATE_WITH_OPENSSL_RAND_HEX_32
  MYVAULT_JWT_SECRET: CHANGE_ME
  OIDC_ISSUER_URL: https://keycloak.example.com/realms/mirai
  OIDC_CLIENT_ID: myvault
  OIDC_CLIENT_SECRET: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: myvault-db-credentials
  namespace: myvault
type: Opaque
stringData:
  POSTGRES_DB: myvault
  POSTGRES_USER: myvault
  POSTGRES_PASSWORD: CHANGE_ME
