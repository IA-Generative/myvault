# TEMPLATE — copier en `secrets.yaml` (gitignoré) puis renseigner les vraies valeurs.
# Ne JAMAIS committer secrets.yaml avec de vraies valeurs.
# Générer la master key : openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: myvault-credentials
type: Opaque
stringData:
  # Credentials PostgreSQL partagé (mêmes que owuicore-main)
  POSTGRES_USER: owui
  POSTGRES_PASSWORD: CHANGE_ME
  # Secrets propres à MyVault
  MYVAULT_MASTER_KEY: CHANGE_ME_GENERATE_WITH_OPENSSL_RAND_HEX_32
  MYVAULT_JWT_SECRET: CHANGE_ME
  # Keycloak — realm openwebui
  OIDC_ISSUER_URL: http://keycloak:8080/realms/openwebui
  OIDC_CLIENT_ID: myvault
  OIDC_CLIENT_SECRET: CHANGE_ME
