apiVersion: apps/v1
kind: Deployment
metadata:
  name: myvault-backend
  labels:
    app: myvault-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myvault-backend
  template:
    metadata:
      labels:
        app: myvault-backend
    spec:
      containers:
        - name: backend
          image: myvault-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: myvault-credentials
            - configMapRef:
                name: myvault-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: myvault-backend
spec:
  selector:
    app: myvault-backend
  ports:
    - port: 8000
      targetPort: 8000
