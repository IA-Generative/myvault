apiVersion: v1
kind: ConfigMap
metadata:
  name: myvault-config
data:
  # PostgreSQL partagé d'owuicore-main (même namespace ou cross-namespace)
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: myvault
  MYVAULT_LOG_LEVEL: info
  MYVAULT_DEV_MODE: "false"
  MYVAULT_CORS_ORIGINS: "https://myvault.example.com"
