apiVersion: apps/v1
kind: Deployment
metadata:
  name: myvault-postgres
  namespace: myvault
  labels:
    app: myvault-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myvault-postgres
  template:
    metadata:
      labels:
        app: myvault-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: myvault-db-credentials
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "myvault"]
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "myvault"]
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: myvault-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: myvault-postgres
  namespace: myvault
spec:
  selector:
    app: myvault-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: myvault-postgres-pvc
  namespace: myvault
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
