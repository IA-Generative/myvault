apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myvault-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - myvault.example.com
      secretName: myvault-tls
  rules:
    - host: myvault.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: myvault-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: myvault-frontend
                port:
                  number: 3000
