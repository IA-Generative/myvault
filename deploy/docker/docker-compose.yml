version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myvault}
      POSTGRES_USER: ${POSTGRES_USER:-myvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_db_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myvault}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-myvault}
      POSTGRES_USER: ${POSTGRES_USER:-myvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_db_password}
      MYVAULT_MASTER_KEY: ${MYVAULT_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      MYVAULT_JWT_SECRET: ${MYVAULT_JWT_SECRET:-dev-jwt-secret}
      MYVAULT_DEV_MODE: ${MYVAULT_DEV_MODE:-true}
      MYVAULT_DEV_ADMIN: ${MYVAULT_DEV_ADMIN:-true}
      MYVAULT_CORS_ORIGINS: http://localhost:8085
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://keycloak:8080/realms/openwebui}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-myvault}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    ports:
      - "${MYVAULT_BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health/live').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    ports:
      - "8085:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
